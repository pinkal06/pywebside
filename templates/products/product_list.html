{% extends "base.html" %}
{% block content %}
<div class="container py-5"><div class="d-flex justify-content-between align-items-center mb-4"><h1>Products</h1>{% if user.is_authenticated %}<a href="{% url 'product_create' %}" class="btn btn-primary">Sell a product</a>{% endif %}</div>
<form class="row g-2 mb-4" method="get"><div class="col-md-5"><input class="form-control" name="q" value="{{ query }}" placeholder="Search products"></div><div class="col-md-3"><select class="form-select" name="category"><option value="">All categories</option>{% for item in categories %}<option value="{{ item.slug }}" {% if selected_category == item.slug %}selected{% endif %}>{{ item.name }}</option>{% endfor %}</select></div><div class="col-md-2"><select class="form-select" name="condition"><option value="">Any condition</option>{% for value,label in product_conditions %}<option value="{{ value }}" {% if selected_condition == value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></div><div class="col-md-2"><button class="btn btn-outline-primary w-100">Filter</button></div></form>
<div class="row g-4">{% for product in products %}<div class="col-sm-6 col-lg-4">{% include "products/_card.html" %}</div>{% empty %}<p>No products found.</p>{% endfor %}</div></div>
{% endblock %}
