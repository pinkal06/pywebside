{% extends 'base.html' %}

{% block content %}
<section class="py-5">
  <div class="container auth-shell">
    <div class="row justify-content-center">
      <div class="col-md-7 col-lg-6">
        <div class="auth-card text-center">
          <div class="auth-icon danger mb-4"><i class="bi bi-person-x"></i></div>
          <h2 class="mb-3">Deactivate account?</h2>
          <p class="text-muted mb-4">You will be signed out and your account will no longer be active.</p>
          <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Deactivate account</button>
            <a href="{% url 'profile' %}" class="btn btn-outline-secondary ms-2">Cancel</a>
          </form>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
