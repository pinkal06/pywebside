{% extends 'base.html' %}

{% block content %}
<section class="py-5">
  <div class="container auth-shell">
    <div class="row justify-content-center">
      <div class="col-md-7 col-lg-6">
        <div class="auth-card text-center">
          <div class="auth-icon danger mb-4"><i class="bi bi-person-x"></i></div>
          <span class="eyebrow mb-3">Access restricted</span>
          <h2 class="mb-3">Account deactivated</h2>
          <p class="text-muted mb-4">This account is currently inactive or deactivated. Contact support to reactivate it.</p>
          <a href="{% url 'login' %}" class="btn btn-primary">Back to login</a>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
