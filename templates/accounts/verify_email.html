{% extends 'base.html' %}

{% block content %}
<section class="py-5">
  <div class="container auth-shell">
    <div class="row justify-content-center">
      <div class="col-md-7 col-lg-6">
        <div class="auth-card text-center">
          {% if verified %}
            <div class="auth-icon mb-4"><i class="bi bi-check-circle"></i></div>
            <h2 class="mb-3">Email verified</h2>
            <p class="text-muted mb-4">Your account is verified and ready to use.</p>
            <a href="{% url 'login' %}" class="btn btn-primary">Continue to login</a>
          {% else %}
            <div class="auth-icon danger mb-4"><i class="bi bi-x-circle"></i></div>
            <h2 class="mb-3">Verification failed</h2>
            <p class="text-muted mb-4">This verification link is invalid or has expired.</p>
            <a href="{% url 'resend_verification' %}" class="btn btn-primary">Request a new link</a>
          {% endif %}
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
