{% extends 'base.html' %}

{% block content %}
<section class="py-5">
  <div class="container auth-shell">
    <div class="row justify-content-center">
      <div class="col-md-7 col-lg-6">
        <div class="auth-card text-center">
          <div class="auth-icon success mb-4"><i class="bi bi-shield-check"></i></div>
          <span class="eyebrow mb-3">Password updated</span>
          <h2 class="mb-3">Your password has been reset successfully</h2>
          <p class="text-muted mb-4">You can now log in using your new password.</p>
          <a href="{% url 'login' %}" class="btn btn-primary">Login now</a>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
