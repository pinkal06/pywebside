{% extends 'base.html' %}

{% block content %}
<section class="py-5">
  <div class="container auth-shell">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="auth-card">
          <div class="auth-card-header text-center mb-4">
            <span class="eyebrow mb-3">Reset access</span>
            <h2 class="mb-2">Forgot password</h2>
            <p class="text-muted mb-0">Enter your email to receive a password reset link.</p>
          </div>

          <form method="post" class="needs-validation" novalidate>
            {% csrf_token %}
            {{ form.non_field_errors }}

            <div class="mb-3">
              <label for="{{ form.email.id_for_label }}" class="form-label">{{ form.email.label }}</label>
              {{ form.email }}
              {% if form.email.errors %}<div class="invalid-feedback d-block">{{ form.email.errors|join:', ' }}</div>{% endif %}
            </div>

            <button type="submit" class="btn btn-primary w-100">Send reset link</button>

            <div class="text-center mt-3 small text-muted">
              <a href="{% url 'login' %}" class="text-decoration-none">Back to login</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
