{% extends "base.html" %}
{% block content %}
<section class="py-5"><div class="container"><div class="row justify-content-center"><div class="col-lg-7">
  <div class="card shadow-sm border-0 p-4">
    <h1 class="h3">Notification settings</h1>
    <p class="text-secondary">WhatsApp is currently simulated locally; no real messages are sent.</p>
    <form method="post">
      {% csrf_token %}
      <div class="form-check mb-3">
        <input class="form-check-input" type="checkbox" name="whatsapp_opt_in" id="whatsapp_opt_in" {% if profile.whatsapp_opt_in %}checked{% endif %}>
        <label class="form-check-label" for="whatsapp_opt_in">Receive transactional WhatsApp notifications</label>
      </div>
      <button class="btn btn-primary" type="submit">Save settings</button>
    </form>
  </div>
</div></div></div></section>
{% endblock %}
