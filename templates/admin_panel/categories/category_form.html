{% extends "admin_panel/base_admin.html" %}

{% block content %}
<div class="container-fluid p-0" style="max-width: 700px;">
  <div class="d-flex align-items-center gap-3 mb-4">
    <a href="{% url 'admin_panel:category_list' %}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left"></i> Categories</a>
    <h4 class="fw-bold mb-0">{{ page_title }}</h4>
  </div>

  <div class="card border-0 shadow-sm rounded-3 p-4">
    <form method="post">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label fw-semibold">Category Name <span class="text-danger">*</span></label>
        <input type="text" name="name" class="form-control" value="{{ name|default:category.name }}" placeholder="E.g., Books & Study Material" required>
        <small class="text-muted">Must be unique across the marketplace.</small>
      </div>

      <div class="mb-3">
        <label class="form-label fw-semibold">Slug (URL identifier)</label>
        <input type="text" name="slug" class="form-control" value="{{ slug|default:category.slug }}" placeholder="Auto-generated from name if left empty">
      </div>

      <div class="mb-3">
        <label class="form-label fw-semibold">Description</label>
        <textarea name="description" rows="3" class="form-control" placeholder="Brief description of items accepted under this category...">{{ description|default:category.description }}</textarea>
      </div>

      <div class="form-check form-switch mb-4">
        <input class="form-check-input" type="checkbox" name="is_active" id="isActiveCheck" {% if is_active or category.is_active %}checked{% endif %}>
        <label class="form-check-label fw-semibold" for="isActiveCheck">Active (visible to buyers & sellers)</label>
      </div>

      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary">Save Category</button>
        <a href="{% url 'admin_panel:category_list' %}" class="btn btn-outline-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
