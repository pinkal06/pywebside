{% extends "base.html" %}
{% block content %}
<div class="container py-5">
  <h1>Checkout</h1>
  <div class="row g-4">
    <div class="col-md-7">
      <div class="card p-4"><h4>Shipping address</h4>
        <form method="post">{% csrf_token %}{{ form.as_p }}<button class="btn btn-primary">Place order</button></form>
      </div>
    </div>
    <div class="col-md-5"><div class="card p-4"><h4>Order summary</h4>
      {% for item in items %}<div class="d-flex justify-content-between"><span>{{ item.product.title }} × {{ item.quantity }}</span><span>₹{{ item.line_total|floatformat:2 }}</span></div>{% endfor %}
      <hr><strong>Total: ₹{{ cart_total|floatformat:2 }}</strong>
    </div></div>
  </div>
</div>
{% endblock %}
