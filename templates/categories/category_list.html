{% extends "base.html" %}
{% block content %}
<div class="container py-5">
  <div class="d-flex justify-content-between align-items-center mb-4"><h1>Categories</h1>{% if user.is_staff %}<a class="btn btn-primary" href="{% url 'category_create' %}">Add category</a>{% endif %}</div>
  <div class="row g-3">{% for category in categories %}<div class="col-md-4"><a class="card h-100 text-decoration-none shadow-sm" href="{{ category.get_absolute_url }}"><div class="card-body"><h5 class="card-title">{{ category.name }}</h5><p class="text-secondary mb-0">{{ category.description|truncatewords:20 }}</p></div></a></div>{% empty %}<p>No categories available yet.</p>{% endfor %}</div>
</div>
{% endblock %}
